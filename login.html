<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b25"><title>Minha Evolução — Acesso</title><link rel="stylesheet" href="/style.css"></head><body><main class="login-shell"><div class="login-brand">✦ Minha Evolução</div><article class="meal login-card"><div class="eyebrow">SEU ESPAÇO PRIVADO</div><h1 id="heading">Bem-vindo</h1><p class="muted">Para novos cadastros, entre com Google. Seu acesso será liberado somente após aprovação administrativa.</p><a id="google-login" class="google-login" href="/api/auth/google/start"><span aria-hidden="true">G</span> Continuar com Google</a><p id="google-config" class="muted" role="status"></p><div class="login-separator"><span>Acesso administrativo existente</span></div><form id="form" class="login-form"><label id="userLabel">Usuário<input name="username" autocomplete="username" required value="Rafael"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar como administrador</button><p id="error" role="alert"></p></form><p class="muted login-footer">Cadastros pendentes, rejeitados ou bloqueados não acessam informações pessoais.</p></article></main><script src="/auth.js"></script></body></html>
