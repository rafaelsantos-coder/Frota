services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota -d frota"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
